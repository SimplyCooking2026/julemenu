<!DOCTYPE html>
<html lang="da">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Julemenu – bestil julemad</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link href="https://fonts.googleapis.com/css2?family=Fraunces:opsz,wght@9..144,500;9..144,700&family=Inter:wght@400;500;600&display=swap" rel="stylesheet">
<style>
:root{
  /* Simply Cooking jule-palet: #a3bfb7 #304f3f #243e31 #022f26 #38383e #a1d60b (+ julerød) */
  --bg:#f3f7f5; --card:#ffffff; --ink:#022f26; --muted:#38383e; --line:#d5e2de;
  --green:#022f26; --green-2:#304f3f; --red:#c8102e; --red-soft:#fbe6e9; --gold:#a1d60b;
  --ok:#022f26; --ok-soft:#a3bfb7; --warn:#022f26; --warn-soft:#e6f5c2; --tint:#d5e2de; --sky:#a3bfb7; --lime:#a1d60b;
  --r:14px;
}
*{box-sizing:border-box}
html,body{margin:0}
body{font-family:Inter,system-ui,sans-serif;background:var(--bg);color:var(--ink);font-size:16px;line-height:1.5}
h1,h2,h3{font-family:Fraunces,Georgia,serif;font-weight:700;line-height:1.15;margin:0 0 .4em}
h1{font-size:clamp(1.8rem,5vw,2.6rem)} h2{font-size:1.35rem} h3{font-size:1.05rem}
button,input,select,textarea{font:inherit;color:inherit}
a{color:var(--green-2)}
.wrap{max-width:640px;margin:0 auto;padding:20px 16px 80px}
.wrap.wide{max-width:1100px}
.topbar{background:#022f26;color:#fff;padding:10px 16px;display:flex;gap:8px;align-items:center;flex-wrap:wrap;font-size:.85rem}
.topbar b{font-family:Fraunces,serif;font-size:1rem;margin-right:auto}
.topbar a{color:#fff;text-decoration:none;padding:6px 10px;border-radius:8px;border:1px solid rgba(255,255,255,.3)}
.topbar a.on{background:#a1d60b;color:#022f26;border-color:#a1d60b}
.hero{padding:28px 0 8px;border-bottom:4px solid var(--gold);margin-bottom:6px;position:relative}
.hero .deco{position:absolute;right:0;top:18px;width:84px;height:100px}
.hero .deco + *{}
@media(max-width:420px){.hero .deco{width:64px;height:76px}}
.eyebrow{text-transform:uppercase;letter-spacing:.12em;font-size:.75rem;color:var(--green-2);font-weight:700}
.lead{color:var(--muted);margin:0 0 6px}
.card{background:var(--card);border:1.5px solid var(--line);border-radius:var(--r);padding:18px;margin:14px 0}
.pill{display:inline-block;padding:3px 10px;border-radius:999px;font-size:.78rem;font-weight:600}
.pill.ok{background:var(--ok-soft);color:var(--ok)} .pill.warn{background:var(--warn-soft);color:var(--warn)}
.pill.red{background:var(--red-soft);color:var(--red)} .pill.grey{background:var(--tint);color:#022f26}
.info{display:grid;grid-template-columns:auto 1fr;gap:4px 12px;font-size:.92rem}
.info dt{color:var(--muted)} .info dd{margin:0;font-weight:500}
.prod{display:flex;gap:12px;align-items:center;padding:14px 0;border-top:1px solid var(--line)}
.prod:first-of-type{border-top:0}
.prod .t{flex:1}
.prod .n{font-weight:600} .prod .u{color:var(--muted);font-size:.85rem}
.prod .p{font-weight:600;white-space:nowrap}
.step{display:flex;align-items:center;border:1px solid var(--line);border-radius:999px;overflow:hidden;background:#fff}
.step button{border:0;background:none;width:40px;height:40px;font-size:1.3rem;cursor:pointer;color:var(--green)}
.step button:disabled{color:#c4c0bc;cursor:default}
.step span{min-width:26px;text-align:center;font-weight:600}
.deal{background:var(--sky);color:#022f26;border-radius:10px;padding:10px 12px;font-size:.9rem;margin-top:10px}
label{display:block;font-weight:500;font-size:.9rem;margin:12px 0 4px}
input[type=text],input[type=tel],input[type=email],select,textarea{width:100%;padding:12px;border:1px solid var(--line);border-radius:10px;background:#fff}
textarea{min-height:120px;font-family:ui-monospace,Menlo,monospace;font-size:.82rem}
input:focus,select:focus,textarea:focus{outline:2px solid var(--green-2);outline-offset:1px}
.check{display:flex;gap:10px;align-items:flex-start;font-weight:400;font-size:.88rem;color:var(--muted)}
.check input{margin-top:4px;width:18px;height:18px}
.err{color:var(--red);font-size:.85rem;margin-top:4px}
.btn{display:inline-flex;align-items:center;justify-content:center;gap:8px;border:0;border-radius:12px;padding:14px 18px;font-weight:600;cursor:pointer;text-decoration:none;font-size:1rem}
.btn.primary{background:var(--green);color:#fff}
.btn.mp{background:#5a78ff;color:#fff;width:100%;font-size:1.1rem;padding:16px}
.btn.ghost{background:transparent;border:1px solid var(--line);color:var(--ink)}
.btn.small{padding:7px 11px;font-size:.85rem;border-radius:9px}
.btn:disabled{opacity:.45;cursor:not-allowed}
.btn.block{width:100%}
.sum{position:sticky;bottom:0;background:#022f26;color:#fff;border-radius:var(--r);padding:14px 16px;display:flex;align-items:center;gap:12px;margin-top:16px;box-shadow:0 8px 24px rgba(0,0,0,.25)}
.sum .tot{font-family:Fraunces,serif;font-size:1.5rem;margin-right:auto}
.sum .tot small{display:block;font-family:Inter;font-size:.75rem;opacity:.8}
.sum .btn{background:#a1d60b;color:#022f26}
table{width:100%;border-collapse:collapse;font-size:.88rem}
th,td{text-align:left;padding:8px 6px;border-bottom:1px solid var(--line);vertical-align:top}
th{color:var(--muted);font-weight:500;font-size:.78rem;text-transform:uppercase;letter-spacing:.05em}
td.num,th.num{text-align:right;font-variant-numeric:tabular-nums}
.lines td{border:0;padding:3px 0} .lines tr.total td{border-top:1px solid var(--line);padding-top:8px;font-weight:700}
.ordno{font-family:ui-monospace,Menlo,monospace;font-weight:700;letter-spacing:.04em}
.big-ordno{font-family:ui-monospace,Menlo,monospace;font-size:1.8rem;font-weight:700;letter-spacing:.06em;color:var(--green)}
.grid{display:grid;gap:14px}
@media(min-width:800px){.grid.c2{grid-template-columns:1fr 1fr}.grid.c3{grid-template-columns:repeat(3,1fr)}.grid.c4{grid-template-columns:repeat(4,1fr)}}
.kpi{background:var(--card);border:1px solid var(--line);border-radius:var(--r);padding:14px}
.kpi .v{font-family:Fraunces,serif;font-size:1.7rem;font-weight:700}
.kpi .l{color:var(--muted);font-size:.82rem}
.tabs{display:flex;gap:6px;flex-wrap:wrap;margin:10px 0}
.tabs button{border:1px solid var(--line);background:var(--card);border-radius:999px;padding:7px 14px;cursor:pointer;font-size:.88rem}
.tabs button.on{background:#022f26;color:#fff;border-color:#022f26}
.labels{display:grid;grid-template-columns:repeat(auto-fill,minmax(230px,1fr));gap:10px}
.label{background:#fff;border:1.5px dashed #304f3f;border-radius:8px;padding:10px 12px;font-size:.78rem;line-height:1.35}
.label .who{font-family:Fraunces,serif;font-size:1.05rem;font-weight:700}
.label .what{font-weight:700;font-size:.9rem;margin:4px 0;color:var(--red)}
.label b{font-weight:800;text-transform:uppercase}
.qrs{display:grid;grid-template-columns:repeat(auto-fill,minmax(240px,1fr));gap:14px}
.qr{background:#fff;border:1px solid var(--line);border-radius:var(--r);padding:16px;text-align:center}
.qr svg{width:100%;height:auto;max-width:220px}
.muted{color:var(--muted)} .small{font-size:.82rem}
.row{display:flex;gap:8px;flex-wrap:wrap;align-items:center}
.closed{background:var(--red-soft);border:1px solid #c8102e;color:#022f26;border-radius:var(--r);padding:18px}
.notice{background:var(--warn-soft);border:1px solid #a1d60b;border-radius:10px;padding:10px 12px;font-size:.85rem;color:#022f26}
.toast{position:fixed;left:50%;bottom:20px;transform:translateX(-50%);background:var(--ink);color:#fff;padding:10px 16px;border-radius:10px;font-size:.9rem;opacity:0;transition:opacity .2s;pointer-events:none;z-index:9}
.toast.show{opacity:1}
.hidden{display:none!important}
</style>
</head>
<body>


<div id="testBanner" style="display:none;background:#a1d60b;color:#022f26;text-align:center;font-weight:600;font-size:.85rem;padding:6px">TESTPRISER – alle varer koster 1 kr.</div>
<main id="app"></main>
<div class="toast" id="toast"></div>

<script>
/* =====================================================================
   KONFIGURATION – det eneste sted, der skal rettes før go-live
   ===================================================================== */
const CONFIG = {
  // Tider i dansk tid (UTC+01:00 i december)
  orderDeadline: '2026-12-17T12:00:00+01:00',
  pickupFrom:    '2026-12-21T14:00:00+01:00',

  // Offentlig adresse, hvor bestillingssiden hostes (bruges i QR-koderne)
  publicUrl: 'https://simplycooking2026.github.io/julemenu/',

  // MobilePay betalingslink (format fra MobilePay-support 20.11.2026):
  // https://qr.mobilepay.dk/paymentlink?phone=…&amount=…&comment=…&lock=1
  // comment = beskrivelse (maks 60 tegn, ingen personoplysninger), lock=1 = kunden kan ikke ændre den.
  mobilePayLinkBase: 'https://qr.mobilepay.dk/paymentlink',
  // Beløbsformat i linket: kroner (bekræftet med test 20.11.2026 – amount=200 viste 200 kr.).
  //   'kr' → 250 kr. sendes som 250   |   'oere' → 250 kr. sendes som 25000
  amountFormat: 'kr',
  // Beskrivelsen i MobilePay = ordrenr. + varer, fx "JUL-A-7K3Q 1 and, 2 rødkål" (maks 60 tegn).
  // Så kan køkkenet se hele ordren direkte i MobilePay-eksporten.
  maxPerItem: 20,

  // Hvor ordren sendes hen. Tom = prototype (gemmes kun lokalt i browseren).
  // I drift: URL til fx et Power Automate-flow ("When an HTTP request is received"),
  // der skriver ordren i en SharePoint-liste.
  orderEndpoint: '',

  // Ét fælles MobilePay-nummer til alle kantiner. Kantinen kan ses af ordrenummeret
  // (JUL-A-…, JUL-B-…), så omsætningen kan stadig fordeles pr. kantine.
  mobilePayNumber: '849000',   // Simply Cooking Event

  // Én linje pr. kantine. "code" bruges i ordrenummeret. Udfyld rigtige navne og adresser.
  canteens: [
    { id:'kantine-a', code:'A', name:'Kantine A', address:'Adresse udfyldes' },
    { id:'kantine-b', code:'B', name:'Kantine B', address:'Adresse udfyldes' },
    { id:'kantine-c', code:'C', name:'Kantine C', address:'Adresse udfyldes' },
  ],

  // Produkter. Ingredienslister er EKSEMPLER – køkkenet skal udfylde de rigtige.
  // Allergener markeres med *stjerner* og bliver fede/versaler på etiketten.
  products: [
    { id:'and',     kind:'main',  short:'and',  name:'Økologisk frilands juleand', unit:'1 stk', price:500,
      ingredients:'Økologisk frilandsand, salt, peber, æble, svesker, timian',
      storage:'Opbevares på køl, 0–5 °C. Genopvarmes til min. 75 °C.' },
    { id:'andesovs', kind:'sauce', short:'andesovs', name:'Andesovs', unit:'1 liter', price:150,
      ingredients:'Andefond, *fløde*, *hvedemel*, *smør*, ribsgelé, salt, peber',
      storage:'Opbevares på køl, 0–5 °C. Opvarmes under omrøring.' },
    { id:'flaeskesovs', kind:'sauce', short:'flæskesovs', name:'Flæskestegssovs', unit:'1 liter', price:150,
      ingredients:'Svinefond, *fløde*, *hvedemel*, *smør*, laurbærblad, salt, peber',
      storage:'Opbevares på køl, 0–5 °C. Opvarmes under omrøring.' },
    { id:'roedkaal', kind:'side', short:'rødkål', name:'Rødkål', unit:'1 liter', price:100,
      ingredients:'Rødkål, eddike, sukker, ribssaft, æble, kanel, nellike, salt',
      storage:'Opbevares på køl, 0–5 °C.' },
  ],

  // Pakkepris: 1 valgfri sovs + 1 rødkål = 220 kr. (normalt 250 kr.)
  // Gives automatisk for hvert par sovs + rødkål i kurven.
  bundlePrice: 220,

  producer: 'Simply Cooking · CVR udfyldes',

  // TESTPRISER: true = alle varer koster 1 kr. (til testbetalinger). SÆT TIL false FØR GO-LIVE.
  testPrices: true,
  // Pakkepris (sovs + rødkål) til/fra. Slås automatisk fra i testtilstand.
  bundleEnabled: false,   // pakkepris fjernet 20.11.2026
  vatRate: 0.25,
};

/* ===================================================================== */
if(CONFIG.testPrices){ CONFIG.products.forEach(p => p.price = 1); CONFIG.bundleEnabled = false; }
const $ = (s, el=document) => el.querySelector(s);
const kr = n => n.toLocaleString('da-DK', {minimumFractionDigits:0, maximumFractionDigits:2}) + ' kr.';
const esc = s => String(s ?? '').replace(/[&<>"']/g, c => ({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[c]));
const fmtDate = iso => new Date(iso).toLocaleString('da-DK',{timeZone:'Europe/Copenhagen',weekday:'long',day:'numeric',month:'long',hour:'2-digit',minute:'2-digit'});
const prodById = id => CONFIG.products.find(p => p.id === id);
const canteenById = id => CONFIG.canteens.find(c => c.id === id);

function toast(msg){ const t=$('#toast'); t.textContent=msg; t.classList.add('show'); clearTimeout(toast._t); toast._t=setTimeout(()=>t.classList.remove('show'),2200); }

/* ---------- Lager (prototype: browserens localStorage, med fallback) ---------- */
const store = {
  mem: {},
  get(k, d){ try{ const v = localStorage.getItem(k); return v ? JSON.parse(v) : (this.mem[k] ?? d); }catch(e){ return this.mem[k] ?? d; } },
  set(k, v){ this.mem[k] = v; try{ localStorage.setItem(k, JSON.stringify(v)); }catch(e){} },
};
const ORDERS_KEY = 'julemenu-orders-v1';
const getOrders = () => store.get(ORDERS_KEY, []);
const saveOrders = o => store.set(ORDERS_KEY, o);
function updateOrder(no, patch){
  const all = getOrders(); const o = all.find(x => x.orderNo === no);
  if(o){ Object.assign(o, patch, {updatedAt:new Date().toISOString()}); saveOrders(all); }
  return o;
}

/* ---------- Tid (kan simuleres i personalevisningen) ---------- */
let simulatedNow = null;
const now = () => simulatedNow ? new Date(simulatedNow) : new Date();
const isOpen = () => now() < new Date(CONFIG.orderDeadline);

/* ---------- Prisberegning ---------- */
function priceCart(cart){
  const lines = [];
  let gross = 0;
  for(const p of CONFIG.products){
    const q = cart[p.id] || 0;
    if(q > 0){ lines.push({id:p.id, name:p.name, unit:p.unit, qty:q, unitPrice:p.price, amount:q*p.price}); gross += q*p.price; }
  }
  const sauces = CONFIG.products.filter(p=>p.kind==='sauce').reduce((s,p)=>s+(cart[p.id]||0),0);
  const sides  = CONFIG.products.filter(p=>p.kind==='side').reduce((s,p)=>s+(cart[p.id]||0),0);
  const sauceP = CONFIG.products.find(p=>p.kind==='sauce').price, sideP = CONFIG.products.find(p=>p.kind==='side').price;
  const normalPair = sauceP + sideP;
  const bundles = CONFIG.bundleEnabled && normalPair > CONFIG.bundlePrice ? Math.min(sauces, sides) : 0;
  const discount = bundles * (normalPair - CONFIG.bundlePrice);
  if(bundles > 0) lines.push({id:'pakkerabat', name:`Pakkepris sovs + rødkål (${bundles} × ${CONFIG.bundlePrice} kr.)`, qty:bundles, unitPrice:-(normalPair-CONFIG.bundlePrice), amount:-discount});
  const total = gross - discount;
  const vat = Math.round(total * CONFIG.vatRate / (1 + CONFIG.vatRate) * 100) / 100;
  return { lines, gross, bundles, discount, total, vat, sauces, sides, items: Object.values(cart).reduce((a,b)=>a+b,0) };
}

/* ---------- Ordrenummer + MobilePay-link ---------- */
function newOrderNo(canteen){
  const existing = new Set(getOrders().map(o=>o.orderNo));
  let no;
  const abc = 'ABCDEFGHJKLMNPQRSTUVWXYZ23456789';
  do { no = `JUL-${canteen.code}-` + Array.from({length:4}, () => abc[Math.floor(Math.random()*abc.length)]).join(''); } while(existing.has(no));
  return no;
}
function orderComment(order){
  const parts = CONFIG.products.filter(p => order.cart[p.id] > 0).map(p => `${order.cart[p.id]} ${p.short}`);
  let c = `${order.orderNo} ${parts.join(', ')}`;
  if(c.length > 60) c = `${order.orderNo} ` + CONFIG.products.filter(p => order.cart[p.id] > 0).map(p => `${order.cart[p.id]}${p.short.slice(0,3)}`).join(' ');
  return c.slice(0, 60);
}
function mobilePayLink(order){
  const u = new URL(CONFIG.mobilePayLinkBase);
  u.searchParams.set('phone', CONFIG.mobilePayNumber);
  u.searchParams.set('amount', CONFIG.amountFormat === 'oere' ? String(Math.round(order.total * 100)) : (Number.isInteger(order.total) ? String(order.total) : order.total.toFixed(2)));
  u.searchParams.set('comment', orderComment(order));   // ordrenr. + varer – ingen personoplysninger
  u.searchParams.set('lock', '1');
  return u.toString().replace(/\+/g, '%20');   // mellemrum som %20, som i MobilePays eget eksempel
}

/* ---------- Send ordre (prototype: lokalt; drift: POST til endpoint) ---------- */
/* Sender ordren til Power Automate. Flowet gemmer den i SharePoint, tildeler det
   endelige ordrenummer (JUL-<kode>-<id>), genberegner totalen ud fra sine egne priser
   og svarer med {ok, orderNo, total}. Body sendes som text/plain, så browseren ikke
   laver et CORS-preflight-kald, som flowet ikke kan besvare. */
async function submitOrder(order){
  if(CONFIG.orderEndpoint){
    const payload = {
      tempNo: order.orderNo, canteenId: order.canteenId, canteenCode: canteenById(order.canteenId).code,
      canteenName: order.canteenName, name: order.name, phone: order.phone, email: order.email,
      and: order.cart.and||0, andesovs: order.cart.andesovs||0, flaeskesovs: order.cart.flaeskesovs||0, roedkaal: order.cart.roedkaal||0,
      clientTotal: order.total, createdAt: order.createdAt,
    };
    const ctrl = new AbortController(); const timer = setTimeout(()=>ctrl.abort(), 30000);
    let res, data;
    try{
      res = await fetch(CONFIG.orderEndpoint, {method:'POST', headers:{'Content-Type':'text/plain;charset=UTF-8'}, body:JSON.stringify(payload), signal:ctrl.signal});
      data = await res.json().catch(()=>null);
    }catch(e){
      throw new Error('Vi kunne ikke sende din bestilling. Tjek din forbindelse og prøv igen.');
    }finally{ clearTimeout(timer); }
    if(!res.ok || !data || !data.ok){
      throw new Error((data && data.message) || 'Bestillingen blev ikke modtaget. Prøv igen om lidt.');
    }
    order.orderNo = data.orderNo;
    if(typeof data.total === 'number' && data.total !== order.total){ order.total = data.total; order.vat = Math.round(data.total*CONFIG.vatRate/(1+CONFIG.vatRate)*100)/100; }
  }
  const all = getOrders(); all.push(order); saveOrders(all);
}

const STATUS = {
  afventer:   {label:'Afventer betaling', cls:'warn'},
  kundebetalt:{label:'Kunde angiver betalt', cls:'grey'},
  betalt:     {label:'Betalt (afstemt)', cls:'ok'},
  udleveret:  {label:'Udleveret', cls:'ok'},
  annulleret: {label:'Annulleret', cls:'red'},
};

/* =====================================================================
   KUNDEVISNING
   ===================================================================== */
const state = { step:'menu', cart:{}, form:{name:'', phone:'', email:'', canteenId:'', terms:false}, order:null, errors:{} };

function canteenFromUrl(){
  try{
    const q = new URLSearchParams(location.search).get('k');
    if(q && canteenById(q)) return q;
  }catch(e){}
  const h = location.hash.replace('#','');
  if(h.startsWith('k-') && canteenById(h.slice(2))) return h.slice(2);
  return '';
}

function renderCustomer(){
  const app = $('#app');
  if(!state.form.canteenId) state.form.canteenId = canteenFromUrl();
  const c = canteenById(state.form.canteenId);

  const header = `
    <div class="hero">
      <svg class="deco" viewBox="0 0 84 100" aria-hidden="true"><rect x="38" y="80" width="8" height="12" fill="#38383e"/><polygon points="42,14 20,44 64,44" fill="#304f3f"/><polygon points="42,30 14,64 70,64" fill="#243e31"/><polygon points="42,48 8,84 76,84" fill="#304f3f"/><circle cx="34" cy="42" r="2.5" fill="#a1d60b"/><circle cx="52" cy="60" r="2.5" fill="#c8102e"/><circle cx="30" cy="76" r="2.5" fill="#a1d60b"/><circle cx="58" cy="78" r="2.5" fill="#c8102e"/><polygon points="42,2 45,10 53,10 47,15 49,23 42,18 35,23 37,15 31,10 39,10" fill="#a1d60b"/><g transform="translate(16 84)" fill="#c8102e"><path d="M0 0C5-7 5-16 0-22C-5-16-5-7 0 0Z"/><path d="M0 0C5-7 5-16 0-22C-5-16-5-7 0 0Z" transform="rotate(72)"/><path d="M0 0C5-7 5-16 0-22C-5-16-5-7 0 0Z" transform="rotate(144)"/><path d="M0 0C5-7 5-16 0-22C-5-16-5-7 0 0Z" transform="rotate(216)"/><path d="M0 0C5-7 5-16 0-22C-5-16-5-7 0 0Z" transform="rotate(288)"/><circle r="2.5" fill="#a1d60b"/></g></svg>
      <div class="eyebrow">Julemenu til at tage med hjem</div>
      <h1 style="padding-right:90px">Juleand med det hele</h1>
      <p class="lead" style="padding-right:90px">Bestil inden <b>${fmtDate(CONFIG.orderDeadline)}</b>. Hent fra <b>${fmtDate(CONFIG.pickupFrom)}</b>${c ? ` i <b>${esc(c.name)}</b>` : ''}.</p>
    </div>`;

  if(!isOpen() && state.step !== 'done'){
    app.innerHTML = `<div class="wrap">${header}
      <div class="closed"><h2>Bestillingen er lukket</h2>
      <p>Fristen var ${fmtDate(CONFIG.orderDeadline)}. Har du bestilt, kan du hente din julemenu fra ${fmtDate(CONFIG.pickupFrom)}. Spørg i kantinen, hvis du har spørgsmål.</p></div></div>`;
    return;
  }

  const p = priceCart(state.cart);

  if(state.step === 'menu'){
    app.innerHTML = `<div class="wrap">${header}
      <section class="card">
        <h2>Vælg din julemenu</h2>
        ${CONFIG.products.map(pr => `
          <div class="prod">
            <div class="t"><div class="n">${esc(pr.name)}</div><div class="u">${esc(pr.unit)} · ${kr(pr.price)}</div></div>
            <div class="step">
              <button aria-label="Færre ${esc(pr.name)}" data-dec="${pr.id}" ${!(state.cart[pr.id]>0)?'disabled':''}>−</button>
              <span>${state.cart[pr.id]||0}</span>
              <button aria-label="Flere ${esc(pr.name)}" data-inc="${pr.id}" ${(state.cart[pr.id]||0)>=CONFIG.maxPerItem?'disabled':''}>+</button>
            </div>
          </div>`).join('')}
        ${CONFIG.bundleEnabled ? `<div class="deal">🎁 <b>Pakkepris:</b> 1 valgfri sovs + 1 rødkål = ${CONFIG.bundlePrice} kr. Rabatten trækkes automatisk fra.</div>` : ''}
      </section>
      ${p.items>0 ? `<section class="card"><table class="lines">${linesHtml(p)}</table></section>` : ''}
      <div class="sum">
        <div class="tot">${kr(p.total)}<small>${p.items} ${p.items===1?'vare':'varer'}${p.discount?` · du sparer ${kr(p.discount)}`:''}</small></div>
        <button class="btn" id="toDetails" ${p.items===0?'disabled':''}>Videre</button>
      </div>
    </div>`;
    app.querySelectorAll('[data-inc]').forEach(b=>b.onclick=()=>{state.cart[b.dataset.inc]=Math.min(CONFIG.maxPerItem,(state.cart[b.dataset.inc]||0)+1); renderCustomer();});
    app.querySelectorAll('[data-dec]').forEach(b=>b.onclick=()=>{state.cart[b.dataset.dec]=Math.max(0,(state.cart[b.dataset.dec]||0)-1); renderCustomer();});
    $('#toDetails').onclick=()=>{state.step='details'; renderCustomer(); scrollTo(0,0);};
    return;
  }

  if(state.step === 'details'){
    const e = state.errors, f = state.form;
    app.innerHTML = `<div class="wrap">${header}
      <form class="card" id="detailsForm" novalidate>
        <h2>Dine oplysninger</h2>
        <p class="muted small">Navnet kommer på etiketten, så vi kan finde din pose ved udlevering.</p>
        <label for="f-name">Navn</label>
        <input type="text" id="f-name" autocomplete="name" value="${esc(f.name)}">
        ${e.name?`<div class="err">${e.name}</div>`:''}
        <label for="f-phone">Mobilnummer</label>
        <input type="tel" id="f-phone" autocomplete="tel" inputmode="numeric" placeholder="8 cifre" value="${esc(f.phone)}">
        ${e.phone?`<div class="err">${e.phone}</div>`:''}
        <label for="f-email">E-mail (til kvittering)</label>
        <input type="email" id="f-email" autocomplete="email" value="${esc(f.email)}">
        ${e.email?`<div class="err">${e.email}</div>`:''}
        <label for="f-canteen">Afhentes i</label>
        <select id="f-canteen">
          <option value="">Vælg kantine</option>
          ${CONFIG.canteens.map(k=>`<option value="${k.id}" ${k.id===f.canteenId?'selected':''}>${esc(k.name)}</option>`).join('')}
        </select>
        ${e.canteenId?`<div class="err">${e.canteenId}</div>`:''}
        <label class="check" style="margin-top:16px"><input type="checkbox" id="f-terms" ${f.terms?'checked':''}>
          <span>Jeg accepterer handelsbetingelserne og at mine oplysninger bruges til at håndtere bestillingen. Friske fødevarer er undtaget fortrydelsesret.</span></label>
        ${e.terms?`<div class="err">${e.terms}</div>`:''}
      </form>
      <section class="card"><table class="lines">${linesHtml(p)}</table></section>
      <div class="row">
        <button class="btn ghost" id="back">Tilbage</button>
        <button class="btn primary" id="toPay" style="flex:1">Gå til betaling · ${kr(p.total)}</button>
      </div>
      <div class="err" id="submitErr" role="alert" style="margin-top:10px;font-size:.95rem"></div>
    </div>`;
    const read = () => { f.name=$('#f-name').value.trim(); f.phone=$('#f-phone').value.replace(/\s/g,''); f.email=$('#f-email').value.trim(); f.canteenId=$('#f-canteen').value; f.terms=$('#f-terms').checked; };
    $('#back').onclick=()=>{read(); state.step='menu'; renderCustomer();};
    $('#toPay').onclick=async ()=>{
      read();
      const er = {};
      if(f.name.length<2) er.name='Skriv dit navn.';
      if(!/^(\+45)?\d{8}$/.test(f.phone)) er.phone='Skriv et dansk mobilnummer på 8 cifre.';
      if(!/^[^@\s]+@[^@\s]+\.[^@\s]+$/.test(f.email)) er.email='Skriv en gyldig e-mail.';
      if(!f.canteenId) er.canteenId='Vælg hvor du henter.';
      if(!f.terms) er.terms='Du skal acceptere betingelserne.';
      state.errors = er;
      if(Object.keys(er).length){ renderCustomer(); return; }
      if(!isOpen()){ renderCustomer(); return; }
      const canteen = canteenById(f.canteenId);
      const order = {
        orderNo: newOrderNo(canteen), createdAt: now().toISOString(), updatedAt: now().toISOString(),
        canteenId: canteen.id, canteenName: canteen.name,
        name: f.name, phone: f.phone, email: f.email,
        cart: {...state.cart}, lines: p.lines, total: p.total, vat: p.vat, discount: p.discount,
        status: 'afventer',
      };
      const btn = $('#toPay'); btn.disabled = true; btn.textContent = 'Sender bestilling …';
      try{ await submitOrder(order); }catch(err){ btn.disabled = false; btn.textContent = `Gå til betaling · ${kr(p.total)}`; state.errors = {submit: err.message}; $('#submitErr') ? ($('#submitErr').textContent = err.message) : toast(err.message); return; }
      state.order = order; state.step = 'pay'; renderCustomer(); scrollTo(0,0);
    };
    return;
  }

  if(state.step === 'pay' || state.step === 'done'){
    const o = state.order, k = canteenById(o.canteenId), link = mobilePayLink(o);
    const done = state.step === 'done';
    app.innerHTML = `<div class="wrap">
      <div class="hero">
        <div class="eyebrow">${done?'Tak for din bestilling':'Sidste trin'}</div>
        <h1>${done?'Vi glæder os til at se dig':'Betal med MobilePay'}</h1>
      </div>
      <section class="card" style="text-align:center">
        <div class="muted small">Dit ordrenummer</div>
        <div class="big-ordno">${o.orderNo}</div>
        <div class="muted small">Vis nummeret ved afhentning</div>
      </section>
      ${done ? `
        <section class="card">
          <h2>Sådan henter du</h2>
          <dl class="info">
            <dt>Hvor</dt><dd>${esc(k.name)}, ${esc(k.address)}</dd>
            <dt>Hvornår</dt><dd>Fra ${fmtDate(CONFIG.pickupFrom)}</dd>
            <dt>Navn</dt><dd>${esc(o.name)}</dd>
            <dt>Betalt</dt><dd>${kr(o.total)} via MobilePay ${esc(CONFIG.mobilePayNumber)}</dd>
          </dl>
          <p class="muted small" style="margin-bottom:0">Vi afstemmer din betaling med ordrenummeret. Kvittering sendes til ${esc(o.email)}.</p>
        </section>` : `
        <section class="card">
          <table class="lines">${linesHtml({lines:o.lines,total:o.total,vat:o.vat})}</table>
        </section>
        <a class="btn mp" href="${esc(link)}" target="_blank" rel="noopener" id="mpBtn">Betal ${kr(o.total)} med MobilePay</a>
        <p class="muted small" style="text-align:center">MobilePay åbner med beløb og ordrenummer udfyldt (nr. ${esc(CONFIG.mobilePayNumber)}).</p>
        <p class="muted small" style="text-align:center">Ordren er først endelig, når betalingen er modtaget.</p>
        <section class="card">
          <h2>Sådan henter du</h2>
          <dl class="info">
            <dt>Hvor</dt><dd>${esc(k.name)}, ${esc(k.address)}</dd>
            <dt>Hvornår</dt><dd>Fra ${fmtDate(CONFIG.pickupFrom)}</dd>
            <dt>Navn</dt><dd>${esc(o.name)}</dd>
            <dt>Ordrenr.</dt><dd class="ordno">${o.orderNo}</dd>
          </dl>
          <p class="muted small" style="margin-bottom:0">Tag gerne et skærmbillede af denne side. Vis ordrenummeret ved afhentning.</p>
        </section>`}
    </div>`;
  }
}

function linesHtml(p){
  return p.lines.map(l=>`<tr><td>${l.id==='pakkerabat'?'':`${l.qty} × `}${esc(l.name)}</td><td class="num" style="${l.amount<0?'color:var(--red)':''}">${kr(l.amount)}</td></tr>`).join('')
    + `<tr class="total"><td>I alt</td><td class="num">${kr(p.total)}</td></tr>`
    + `<tr><td class="muted small">Heraf moms</td><td class="num muted small">${kr(p.vat)}</td></tr>`;
}

/* =====================================================================
   ROUTING
   ===================================================================== */
function route(){
  if(location.hash.replace('#','').startsWith('k-')){ state.form.canteenId = canteenFromUrl(); }
  renderCustomer();
}
if(CONFIG.testPrices) document.getElementById('testBanner').style.display='block';
window.addEventListener('hashchange', route);
route();
</script>
</body>
</html>
