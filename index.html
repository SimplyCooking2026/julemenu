   * qrcode
   * @param typeNumber 1 to 40
   * @param errorCorrectionLevel 'L','M','Q','H'

  var qrcode = function(typeNumber, errorCorrectionLevel) {

    var PAD1 = 0x11;

    var _errorCorrectionLevel = QRErrorCorrectionLevel[errorCorrectionLevel];
    var _modules = null;
    var _moduleCount = 0;
    var _dataCache = null;
    var _dataList = [];

      _modules = function(moduleCount) {
        var modules = new Array(moduleCount);
        for (var row = 0; row < moduleCount; row += 1) {
          modules[row] = new Array(moduleCount);
          for (var col = 0; col < moduleCount; col += 1) {
            modules[row][col] = null;
          }
        }
        return modules;
      }(_moduleCount);

      setupPositionProbePattern(0, 0);
      setupPositionProbePattern(_moduleCount - 7, 0);
      setupPositionProbePattern(0, _moduleCount - 7);
      setupPositionAdjustPattern();
      setupTimingPattern();
      setupTypeInfo(test, maskPattern);

      if (_typeNumber >= 7) {
        setupTypeNumber(test);
      }

      if (_dataCache == null) {
        _dataCache = createData(_typeNumber, _errorCorrectionLevel, _dataList);
      }

      mapData(_dataCache, maskPattern);
    };

    var setupPositionProbePattern = function(row, col) {

      for (var r = -1; r <= 7; r += 1) {

        if (row + r <= -1 || _moduleCount <= row + r) continue;

        for (var c = -1; c <= 7; c += 1) {

          if (col + c <= -1 || _moduleCount <= col + c) continue;

          if ( (0 <= r && r <= 6 && (c == 0 || c == 6) )
              || (0 <= c && c <= 6 && (r == 0 || r == 6) )
              || (2 <= r && r <= 4 && 2 <= c && c <= 4) ) {
            _modules[row + r][col + c] = true;
          } else {
            _modules[row + r][col + c] = false;
          }
        }
      }
    };

    var getBestMaskPattern = function() {

      var minLostPoint = 0;
      var pattern = 0;

      for (var i = 0; i < 8; i += 1) {

        makeImpl(true, i);

        var lostPoint = QRUtil.getLostPoint(_this);

        if (i == 0 || minLostPoint > lostPoint) {
          minLostPoint = lostPoint;
          pattern = i;
        }
      }

      return pattern;
    };

    var setupTimingPattern = function() {

      for (var r = 8; r < _moduleCount - 8; r += 1) {
        if (_modules[r][6] != null) {
          continue;
        }
        _modules[r][6] = (r % 2 == 0);
      }

      for (var c = 8; c < _moduleCount - 8; c += 1) {
        if (_modules[6][c] != null) {
          continue;
        }
        _modules[6][c] = (c % 2 == 0);
      }
    };

    var setupPositionAdjustPattern = function() {

      var pos = QRUtil.getPatternPosition(_typeNumber);

      for (var i = 0; i < pos.length; i += 1) {

        for (var j = 0; j < pos.length; j += 1) {

          var row = pos[i];
          var col = pos[j];

          if (_modules[row][col] != null) {
            continue;
          }

          for (var r = -2; r <= 2; r += 1) {

            for (var c = -2; c <= 2; c += 1) {

              if (r == -2 || r == 2 || c == -2 || c == 2
                  || (r == 0 && c == 0) ) {
                _modules[row + r][col + c] = true;
              } else {
                _modules[row + r][col + c] = false;
              }
            }
          }
        }
      }
    };

    var setupTypeNumber = function(test) {

      var bits = QRUtil.getBCHTypeNumber(_typeNumber);

      for (var i = 0; i < 18; i += 1) {
        var mod = (!test && ( (bits >> i) & 1) == 1);
        _modules[Math.floor(i / 3)][i % 3 + _moduleCount - 8 - 3] = mod;
      }

      for (var i = 0; i < 18; i += 1) {
        var mod = (!test && ( (bits >> i) & 1) == 1);
        _modules[i % 3 + _moduleCount - 8 - 3][Math.floor(i / 3)] = mod;
      }
    };

    var setupTypeInfo = function(test, maskPattern) {

      var data = (_errorCorrectionLevel << 3) | maskPattern;
      var bits = QRUtil.getBCHTypeInfo(data);

      // vertical
      for (var i = 0; i < 15; i += 1) {

        var mod = (!test && ( (bits >> i) & 1) == 1);

        if (i < 6) {
          _modules[i][8] = mod;
        } else if (i < 8) {
          _modules[i + 1][8] = mod;
        } else {
          _modules[_moduleCount - 15 + i][8] = mod;
        }
      }

      // horizontal
      for (var i = 0; i < 15; i += 1) {

        var mod = (!test && ( (bits >> i) & 1) == 1);

        if (i < 8) {
          _modules[8][_moduleCount - i - 1] = mod;
        } else if (i < 9) {
          _modules[8][15 - i - 1 + 1] = mod;
        } else {
          _modules[8][15 - i - 1] = mod;
        }
      }

      // fixed module
      _modules[_moduleCount - 8][8] = (!test);
    };

    var mapData = function(data, maskPattern) {

      var inc = -1;
      var row = _moduleCount - 1;
      var bitIndex = 7;
      var byteIndex = 0;
      var maskFunc = QRUtil.getMaskFunction(maskPattern);

      for (var col = _moduleCount - 1; col > 0; col -= 2) {

        if (col == 6) col -= 1;

        while (true) {

          for (var c = 0; c < 2; c += 1) {

            if (_modules[row][col - c] == null) {

              var dark = false;

              if (byteIndex < data.length) {
                dark = ( ( (data[byteIndex] >>> bitIndex) & 1) == 1);
              }

              var mask = maskFunc(row, col - c);

              if (mask) {
                dark = !dark;
              }

              _modules[row][col - c] = dark;
              bitIndex -= 1;

              if (bitIndex == -1) {
                byteIndex += 1;
                bitIndex = 7;
              }
            }
          }

          row += inc;

          if (row < 0 || _moduleCount <= row) {
            row -= inc;
            inc = -inc;
            break;
          }
        }
      }
    };

    var createBytes = function(buffer, rsBlocks) {

      var offset = 0;

      var maxDcCount = 0;
      var maxEcCount = 0;

      var dcdata = new Array(rsBlocks.length);
      var ecdata = new Array(rsBlocks.length);

      for (var r = 0; r < rsBlocks.length; r += 1) {

        var dcCount = rsBlocks[r].dataCount;
        var ecCount = rsBlocks[r].totalCount - dcCount;

        maxDcCount = Math.max(maxDcCount, dcCount);
        maxEcCount = Math.max(maxEcCount, ecCount);

        dcdata[r] = new Array(dcCount);

        for (var i = 0; i < dcdata[r].length; i += 1) {
          dcdata[r][i] = 0xff & buffer.getBuffer()[i + offset];
        }
        offset += dcCount;

        var rsPoly = QRUtil.getErrorCorrectPolynomial(ecCount);
        var rawPoly = qrPolynomial(dcdata[r], rsPoly.getLength() - 1);

        var modPoly = rawPoly.mod(rsPoly);
        ecdata[r] = new Array(rsPoly.getLength() - 1);
        for (var i = 0; i < ecdata[r].length; i += 1) {
          var modIndex = i + modPoly.getLength() - ecdata[r].length;
          ecdata[r][i] = (modIndex >= 0)? modPoly.getAt(modIndex) : 0;

      var totalCodeCount = 0;
      for (var i = 0; i < rsBlocks.length; i += 1) {
        totalCodeCount += rsBlocks[i].totalCount;
      }

      var data = new Array(totalCodeCount);
      var index = 0;

      for (var i = 0; i < maxDcCount; i += 1) {
        for (var r = 0; r < rsBlocks.length; r += 1) {
          if (i < dcdata[r].length) {
            data[index] = dcdata[r][i];
            index += 1;
          }
        }
      }

      for (var i = 0; i < maxEcCount; i += 1) {
        for (var r = 0; r < rsBlocks.length; r += 1) {
          if (i < ecdata[r].length) {
            data[index] = ecdata[r][i];
            index += 1;
          }
        }
      }

      return data;
    };

    var createData = function(typeNumber, errorCorrectionLevel, dataList) {

      var rsBlocks = QRRSBlock.getRSBlocks(typeNumber, errorCorrectionLevel);

      var buffer = qrBitBuffer();

      for (var i = 0; i < dataList.length; i += 1) {
        var data = dataList[i];
        buffer.put(data.getMode(), 4);
        buffer.put(data.getLength(), QRUtil.getLengthInBits(data.getMode(), typeNumber) );
        data.write(buffer);
      }

      // calc num max data.
      var totalDataCount = 0;
      for (var i = 0; i < rsBlocks.length; i += 1) {
        totalDataCount += rsBlocks[i].dataCount;
      }

      if (buffer.getLengthInBits() > totalDataCount * 8) {
        throw 'code length overflow. ('
          + buffer.getLengthInBits()
          + '>'
          + totalDataCount * 8
          + ')';
      }

      // end code
      if (buffer.getLengthInBits() + 4 <= totalDataCount * 8) {
        buffer.put(0, 4);
      }

      // padding
      while (buffer.getLengthInBits() % 8 != 0) {
        buffer.putBit(false);
      }

      // padding
      while (true) {

        if (buffer.getLengthInBits() >= totalDataCount * 8) {
          break;
        }
        buffer.put(PAD0, 8);

        if (buffer.getLengthInBits() >= totalDataCount * 8) {
          break;
        }
        buffer.put(PAD1, 8);
      }

      return createBytes(buffer, rsBlocks);
    };

    _this.addData = function(data, mode) {

      mode = mode || 'Byte';

      var newData = null;

      switch(mode) {
      case 'Numeric' :
        newData = qrNumber(data);
        break;
      case 'Alphanumeric' :
        newData = qrAlphaNum(data);
        break;
      case 'Byte' :
        newData = qr8BitByte(data);
        break;
      case 'Kanji' :
        newData = qrKanji(data);
        break;
      default :
        throw 'mode:' + mode;
      }

      _dataList.push(newData);
      _dataCache = null;
    };

    _this.isDark = function(row, col) {
      if (row < 0 || _moduleCount <= row || col < 0 || _moduleCount <= col) {
        throw row + ',' + col;
      }
      return _modules[row][col];
    };

    _this.getModuleCount = function() {
      return _moduleCount;
    };

    _this.make = function() {
      if (_typeNumber < 1) {
        var typeNumber = 1;

        for (; typeNumber < 40; typeNumber++) {
          var rsBlocks = QRRSBlock.getRSBlocks(typeNumber, _errorCorrectionLevel);
          var buffer = qrBitBuffer();

          for (var i = 0; i < _dataList.length; i++) {
            var data = _dataList[i];
            buffer.put(data.getMode(), 4);
            buffer.put(data.getLength(), QRUtil.getLengthInBits(data.getMode(), typeNumber) );
            data.write(buffer);
          }

          var totalDataCount = 0;
          for (var i = 0; i < rsBlocks.length; i++) {
            totalDataCount += rsBlocks[i].dataCount;
          }

          if (buffer.getLengthInBits() <= totalDataCount * 8) {
            break;
          }
        }

        _typeNumber = typeNumber;
      }

      makeImpl(false, getBestMaskPattern() );
    };

    _this.createTableTag = function(cellSize, margin) {

      cellSize = cellSize || 2;
      margin = (typeof margin == 'undefined')? cellSize * 4 : margin;

      var qrHtml = '';

      qrHtml += '<table style="';
      qrHtml += ' border-width: 0px; border-style: none;';
      qrHtml += ' border-collapse: collapse;';
      qrHtml += ' padding: 0px; margin: ' + margin + 'px;';
      qrHtml += '">';
      qrHtml += '<tbody>';

      for (var r = 0; r < _this.getModuleCount(); r += 1) {

        qrHtml += '<tr>';

        for (var c = 0; c < _this.getModuleCount(); c += 1) {
          qrHtml += '<td style="';
          qrHtml += ' border-width: 0px; border-style: none;';
          qrHtml += ' border-collapse: collapse;';
          qrHtml += ' padding: 0px; margin: 0px;';
          qrHtml += ' width: ' + cellSize + 'px;';
          qrHtml += ' height: ' + cellSize + 'px;';
          qrHtml += ' background-color: ';
          qrHtml += _this.isDark(r, c)? '#000000' : '#ffffff';
          qrHtml += ';';
          qrHtml += '"/>';
        }

        qrHtml += '</tr>';
      }

      qrHtml += '</tbody>';
      qrHtml += '</table>';

      return qrHtml;

        margin = opts.margin;
        alt = opts.alt;
        title = opts.title;

      margin = (typeof margin == 'undefined')? cellSize * 4 : margin;

      // Compose alt property surrogate
      alt = (typeof alt === 'string') ? {text: alt} : alt || {};

      alt.id = (alt.text) ? alt.id || 'qrcode-description' : null;

      // Compose title property surrogate

      title.id = (title.text) ? title.id || 'qrcode-title' : null;

      var c, mc, r, mr, qrSvg='', rect;

      qrSvg += '<svg version="1.1" xmlns="http://www.w3.org/2000/svg"';
      qrSvg += !opts.scalable ? ' width="' + size + 'px" height="' + size + 'px"' : '';
      qrSvg += ' viewBox="0 0 ' + size + ' ' + size + '" ';
      qrSvg += ' preserveAspectRatio="xMinYMin meet"';
      qrSvg += (title.text || alt.text) ? ' role="img" aria-labelledby="' +
          escapeXml([title.id, alt.id].join(' ').trim() ) + '"' : '';
      qrSvg += '>';
      qrSvg += (title.text) ? '<title id="' + escapeXml(title.id) + '">' +
          escapeXml(title.text) + '</title>' : '';
      qrSvg += (alt.text) ? '<description id="' + escapeXml(alt.id) + '">' +
          escapeXml(alt.text) + '</description>' : '';
      qrSvg += '<rect width="100%" height="100%" fill="white" cx="0" cy="0"/>';
      qrSvg += '<path d="';

      for (r = 0; r < _this.getModuleCount(); r += 1) {
        mr = r * cellSize + margin;
        for (c = 0; c < _this.getModuleCount(); c += 1) {
          if (_this.isDark(r, c) ) {
            mc = c*cellSize+margin;
            qrSvg += 'M' + mc + ',' + mr + rect;
          }
        }
      }

      qrSvg += '" stroke="transparent" fill="black"/>';
      qrSvg += '</svg>';

      return qrSvg;
    };

    _this.createDataURL = function(cellSize, margin) {

      cellSize = cellSize || 2;
      margin = (typeof margin == 'undefined')? cellSize * 4 : margin;

      var size = _this.getModuleCount() * cellSize + margin * 2;
      var min = margin;
      var max = size - margin;

      return createDataURL(size, size, function(x, y) {
        if (min <= x && x < max && min <= y && y < max) {
          var c = Math.floor( (x - min) / cellSize);
          var r = Math.floor( (y - min) / cellSize);
          return _this.isDark(r, c)? 0 : 1;
        } else {
          return 1;
        }
      } );
    };

    _this.createImgTag = function(cellSize, margin, alt) {

      cellSize = cellSize || 2;
      margin = (typeof margin == 'undefined')? cellSize * 4 : margin;

      var size = _this.getModuleCount() * cellSize + margin * 2;

      var img = '';
      img += '<img';
      img += '\u0020src="';
      img += _this.createDataURL(cellSize, margin);
      img += '"';
      img += '\u0020width="';
      img += size;
      img += '"';
      img += '\u0020height="';
      img += size;
      img += '"';
      if (alt) {
        img += '\u0020alt="';
        img += escapeXml(alt);
        img += '"';
      }
      img += '/>';

      return img;
    };

    var escapeXml = function(s) {
      var escaped = '';
      for (var i = 0; i < s.length; i += 1) {
        var c = s.charAt(i);
        switch(c) {
        case '<': escaped += '&lt;'; break;
        case '>': escaped += '&gt;'; break;
        case '&': escaped += '&amp;'; break;
        case '"': escaped += '&quot;'; break;
        default : escaped += c; break;
        }
      }
      return escaped;
    };

    var _createHalfASCII = function(margin) {
      var cellSize = 1;
      margin = (typeof margin == 'undefined')? cellSize * 2 : margin;

      var size = _this.getModuleCount() * cellSize + margin * 2;
      var min = margin;
      var max = size - margin;

      var y, x, r1, r2, p;

      var blocks = {
        '██': '█',
        '█ ': '▀',
        ' █': '▄',
        '  ': ' '
      };

      var blocksLastLineNoMargin = {
        '██': '▀',
        '█ ': '▀',
        ' █': ' ',
        '  ': ' '
      };

      var ascii = '';
      for (y = 0; y < size; y += 2) {
        r1 = Math.floor((y - min) / cellSize);
        r2 = Math.floor((y + 1 - min) / cellSize);
        for (x = 0; x < size; x += 1) {
          p = '█';

          if (min <= x && x < max && min <= y && y < max && _this.isDark(r1, Math.floor((x - min) / cellSize))) {
            p = ' ';
          }

          if (min <= x && x < max && min <= y+1 && y+1 < max && _this.isDark(r2, Math.floor((x - min) / cellSize))) {
            p += ' ';
          }
          else {
            p += '█';
          }

          // Output 2 characters per pixel, to create full square. 1 character per pixels gives only half width of square.
          ascii += (margin < 1 && y+1 >= max) ? blocksLastLineNoMargin[p] : blocks[p];
        }

        ascii += '\n';
      }

      if (size % 2 && margin > 0) {
        return ascii.substring(0, ascii.length - size - 1) + Array(size+1).join('▀');
      }

      return ascii.substring(0, ascii.length-1);
    };

    _this.createASCII = function(cellSize, margin) {
      cellSize = cellSize || 1;

      if (cellSize < 2) {
        return _createHalfASCII(margin);
      }

      cellSize -= 1;
      margin = (typeof margin == 'undefined')? cellSize * 2 : margin;

      var size = _this.getModuleCount() * cellSize + margin * 2;
      var min = margin;
      var max = size - margin;

      var y, x, r, p;

      var white = Array(cellSize+1).join('██');
      var black = Array(cellSize+1).join('  ');

      var ascii = '';
      var line = '';
      for (y = 0; y < size; y += 1) {
        r = Math.floor( (y - min) / cellSize);
        line = '';
        for (x = 0; x < size; x += 1) {
          p = 1;

          if (min <= x && x < max && min <= y && y < max && _this.isDark(r, Math.floor((x - min) / cellSize))) {
            p = 0;
          }

          // Output 2 characters per pixel, to create full square. 1 character per pixels gives only half width of square.
          line += p ? white : black;
        }

        for (r = 0; r < cellSize; r += 1) {
          ascii += line + '\n';
        }
      }

      return ascii.substring(0, ascii.length-1);
    };

    _this.renderTo2dContext = function(context, cellSize) {
      cellSize = cellSize || 2;
      var length = _this.getModuleCount();
      for (var row = 0; row < length; row++) {
        for (var col = 0; col < length; col++) {
          context.fillStyle = _this.isDark(row, col) ? 'black' : 'white';
          context.fillRect(row * cellSize, col * cellSize, cellSize, cellSize);
        }
      }
    }

    return _this;
  };

  // qrcode.stringToBytes
  //---------------------------------------------------------------------

  qrcode.stringToBytesFuncs = {
    'default' : function(s) {
      var bytes = [];
      for (var i = 0; i < s.length; i += 1) {
        var c = s.charCodeAt(i);
        bytes.push(c & 0xff);
      }
      return bytes;
    }
  };

  qrcode.stringToBytes = qrcode.stringToBytesFuncs['default'];

  //---------------------------------------------------------------------
  // qrcode.createStringToBytes

  /**
   * @param unicodeData base64 string of byte array.
   * [16bit Unicode],[16bit Bytes], ...
   * @param numChars
   */
  qrcode.createStringToBytes = function(unicodeData, numChars) {

    // create conversion map.

    var unicodeMap = function() {

      var bin = base64DecodeInputStream(unicodeData);
      var read = function() {
        var b = bin.read();
        if (b == -1) throw 'eof';
        return b;
      };

      var count = 0;
      var unicodeMap = {};
      while (true) {
        var b0 = bin.read();
        if (b0 == -1) break;
        var b1 = read();
        var b2 = read();
        var b3 = read();
        var k = String.fromCharCode( (b0 << 8) | b1);
        var v = (b2 << 8) | b3;
        unicodeMap[k] = v;
        count += 1;
      }
      if (count != numChars) {
        throw count + ' != ' + numChars;
      }

      return unicodeMap;
    }();

    var unknownChar = '?'.charCodeAt(0);

    return function(s) {
      var bytes = [];
      for (var i = 0; i < s.length; i += 1) {
        var c = s.charCodeAt(i);
        if (c < 128) {
          bytes.push(c);
        } else {
          var b = unicodeMap[s.charAt(i)];
          if (typeof b == 'number') {
            if ( (b & 0xff) == b) {
              // 1byte
              bytes.push(b);
            } else {
              // 2bytes
              bytes.push(b >>> 8);
              bytes.push(b & 0xff);
            }
          } else {
            bytes.push(unknownChar);
          }
        }
      }
      return bytes;
    };
  };

  var QRUtil = function() {

    var PATTERN_POSITION_TABLE = [
      [],
      [6, 18],
      [6, 22],
      [6, 26],
      [6, 30],
      [6, 34],

/* ---------- Lager (prototype: browserens localStorage, med fallback) ---------- */
const store = {
  mem: {},
  get(k, d){ try{ const v = localStorage.getItem(k); return v ? JSON.parse(v) : (this.mem[k] ?? d); }catch(e){ return this.mem[k] ?? d; } },
  set(k, v){ this.mem[k] = v; try{ localStorage.setItem(k, JSON.stringify(v)); }catch(e){} },
};
const ORDERS_KEY = 'julemenu-orders-v1';
const getOrders = () => store.get(ORDERS_KEY, []);
const saveOrders = o => store.set(ORDERS_KEY, o);
function updateOrder(no, patch){
  const all = getOrders(); const o = all.find(x => x.orderNo === no);
  if(o){ Object.assign(o, patch, {updatedAt:new Date().toISOString()}); saveOrders(all); }
  return o;
}

/* ---------- Tid (kan simuleres i personalevisningen) ---------- */
let simulatedNow = null;
const now = () => simulatedNow ? new Date(simulatedNow) : new Date();
const isOpen = () => now() < new Date(CONFIG.orderDeadline);

/* ---------- Prisberegning ---------- */
function priceCart(cart){
  const lines = [];
  let gross = 0;
  for(const p of CONFIG.products){
    const q = cart[p.id] || 0;
    if(q > 0){ lines.push({id:p.id, name:p.name, unit:p.unit, qty:q, unitPrice:p.price, amount:q*p.price}); gross += q*p.price; }
  }
  const sauces = CONFIG.products.filter(p=>p.kind==='sauce').reduce((s,p)=>s+(cart[p.id]||0),0);
  const sides  = CONFIG.products.filter(p=>p.kind==='side').reduce((s,p)=>s+(cart[p.id]||0),0);
  const sauceP = CONFIG.products.find(p=>p.kind==='sauce').price, sideP = CONFIG.products.find(p=>p.kind==='side').price;
  const normalPair = sauceP + sideP;
  const bundles = CONFIG.bundleEnabled && normalPair > CONFIG.bundlePrice ? Math.min(sauces, sides) : 0;
  const discount = bundles * (normalPair - CONFIG.bundlePrice);
  if(bundles > 0) lines.push({id:'pakkerabat', name:`Pakkepris sovs + rødkål (${bundles} × ${CONFIG.bundlePrice} kr.)`, qty:bundles, unitPrice:-(normalPair-CONFIG.bundlePrice), amount:-discount});
  const total = gross - discount;
  const vat = Math.round(total * CONFIG.vatRate / (1 + CONFIG.vatRate) * 100) / 100;
  return { lines, gross, bundles, discount, total, vat, sauces, sides, items: Object.values(cart).reduce((a,b)=>a+b,0) };
}

/* ---------- Ordrenummer + MobilePay-link ---------- */
function newOrderNo(canteen){
  const existing = new Set(getOrders().map(o=>o.orderNo));
  let no;
  do { no = `JUL-${canteen.code}-${String(Math.floor(1000 + Math.random()*9000))}`; } while(existing.has(no));
  return no;
}
function mobilePayLink(order){
  const u = new URL(CONFIG.mobilePayLinkBase);
  u.searchParams.set('phone', CONFIG.mobilePayNumber);
  u.searchParams.set('amount', CONFIG.amountFormat === 'oere' ? String(Math.round(order.total * 100)) : order.total.toFixed(2));
  u.searchParams.set('comment', (CONFIG.commentPrefix + order.orderNo).slice(0, 60));   // ingen personoplysninger
  u.searchParams.set('lock', '1');
  return u.toString().replace(/\+/g, '%20');   // mellemrum som %20, som i MobilePays eget eksempel
}

/* ---------- Send ordre (prototype: lokalt; drift: POST til endpoint) ---------- */
async function submitOrder(order){
  if(CONFIG.orderEndpoint){
    const res = await fetch(CONFIG.orderEndpoint, {method:'POST', headers:{'Content-Type':'application/json'}, body:JSON.stringify(order)});
    if(!res.ok) throw new Error('Ordren kunne ikke gemmes ('+res.status+')');
  }
  const all = getOrders(); all.push(order); saveOrders(all);
}

    + `<tr><td class="muted small">Heraf moms</td><td class="num muted small">${kr(p.vat)}</td></tr>`;
}

function runRecon(text){
  const orders = getOrders();
  const res = {matched:[], wrongAmount:[], unknown:[], unpaid:[]};
  const seen = new Set();
  for(const raw of text.split(/\r?\n/)){
    const line = raw.trim(); if(!line) continue;
    const m = line.match(/JUL-[A-Z]-\d{4}/i);
    // beløb: find tal med komma/punktum som decimal, tag det der ligner et beløb
    const amounts = [...line.matchAll(/(?<![\d-])(\d{1,3}(?:[.\s]\d{3})*|\d+)[,.](\d{2})(?!\d)/g)].map(a=>parseFloat(a[1].replace(/[.\s]/g,'')+'.'+a[2]));
    if(!m){ if(amounts.length) res.unknown.push(line); continue; }
    const no = m[0].toUpperCase(); const o = orders.find(x=>x.orderNo===no);
    if(!o){ res.unknown.push(line); continue; }
    const paid = amounts.length ? amounts[0] : NaN;
    if(Math.abs(paid - o.total) < 0.005){
      if(!['betalt','udleveret'].includes(o.status)) o.status='betalt';
      o.paidAt = new Date().toISOString(); res.matched.push(no); seen.add(no);
    } else { res.wrongAmount.push({no, paid, expected:o.total}); seen.add(no); }
  }
  saveOrders(orders);
  res.unpaid = orders.filter(o=>!seen.has(o.orderNo) && ['afventer','kundebetalt'].includes(o.status));
  return res;
}

function bookkeepingTab(orders){
  const rows = CONFIG.canteens.map(k=>{
    const os = orders.filter(o=>o.canteenId===k.id);
    const paid = os.filter(o=>['betalt','udleveret'].includes(o.status));
    const gross = paid.reduce((s,o)=>s+o.total,0), vat = paid.reduce((s,o)=>s+o.vat,0);
    const open = os.filter(o=>!['betalt','udleveret'].includes(o.status)).reduce((s,o)=>s+o.total,0);
    return {k, n:paid.length, gross, vat, net:gross-vat, open};
  });
  const T = rows.reduce((a,r)=>({n:a.n+r.n,gross:a.gross+r.gross,vat:a.vat+r.vat,net:a.net+r.net,open:a.open+r.open}),{n:0,gross:0,vat:0,net:0,open:0});
  return `<div class="card" style="overflow-x:auto">
    <h3>Afstemt omsætning pr. kantine</h3>
    <p class="muted small">Alle betalinger går til MobilePay-nr. ${esc(CONFIG.mobilePayNumber)}; fordelingen pr. kantine sker via ordrenummeret. Sammenhold totalen med MobilePays udbetalinger (efter gebyr) på bankkontoen.</p>
    <table><tr><th>Kantine</th><th>Kode</th><th class="num">Betalte ordrer</th><th class="num">Salg inkl. moms</th><th class="num">Moms 25 %</th><th class="num">Salg ekskl. moms</th><th class="num">Ikke afstemt</th></tr>
    ${rows.map(r=>`<tr><td>${esc(r.k.name)}</td><td>${esc(r.k.code)}</td><td class="num">${r.n}</td><td class="num">${kr(r.gross)}</td><td class="num">${kr(r.vat)}</td><td class="num">${kr(r.net)}</td><td class="num">${kr(r.open)}</td></tr>`).join('')}
    <tr style="font-weight:700"><td>I alt</td><td></td><td class="num">${T.n}</td><td class="num">${kr(T.gross)}</td><td class="num">${kr(T.vat)}</td><td class="num">${kr(T.net)}</td><td class="num">${kr(T.open)}</td></tr></table>
    <div class="row" style="margin-top:12px"><button class="btn ghost small" id="copyCsv">Kopiér alle ordrer som CSV (til Excel)</button></div>
  </div>`;
}

function ordersCsv(){
  const head = ['Ordrenr','Oprettet','Status','Kantine','Kantinekode','Navn','Mobil','E-mail',...CONFIG.products.map(p=>p.name),'Pakkerabat','Total inkl. moms','Moms'];
  const rows = getOrders().map(o=>[o.orderNo,o.createdAt,STATUS[o.status].label,o.canteenName,canteenById(o.canteenId)?.code||'',o.name,o.phone,o.email,...CONFIG.products.map(p=>o.cart[p.id]||0),String(o.discount).replace('.',','),String(o.total).replace('.',','),String(o.vat).replace('.',',')]);
  return [head,...rows].map(r=>r.map(v=>`"${String(v).replace(/"/g,'""')}"`).join(';')).join('\n');
}

function wireStaff(body){
  body.querySelectorAll('[data-set]').forEach(b=>b.onclick=()=>{ updateOrder(b.dataset.no,{status:b.dataset.set}); renderStaff(); });
  const run = $('#reconRun', body);
  if(run){
    run.onclick = () => { staff.recon = runRecon($('#reconInput').value); renderStaff(); };
    $('#reconDemo').onclick = () => {
      const os = getOrders().filter(o=>['afventer','kundebetalt'].includes(o.status));
      const lines = ['Dato;MobilePay-nr;Beløb;Besked'];
      os.forEach((o,i)=>{ if(i%4===3) return; const amt = i%5===4 ? o.total+1 : o.total; lines.push(`12-12-2026;${CONFIG.mobilePayNumber};${amt.toFixed(2).replace('.',',')};${o.orderNo}`); });
      lines.push(`13-12-2026;${CONFIG.mobilePayNumber};500,00;julefrokost`);
      $('#reconInput').value = lines.join('\n');
    };
  }
  const cp = $('#copyCsv', body);
  if(cp) cp.onclick = async () => { try{ await navigator.clipboard.writeText(ordersCsv()); toast('CSV kopieret – indsæt i Excel'); }catch(e){ toast('Kopiering blev afvist af browseren'); } };
}

/* =====================================================================

   ===================================================================== */
function route(){
  const h = location.hash.replace('#','') || 'bestil';
  const view = h==='personale' ? 'personale' : h==='qr' ? 'qr' : 'bestil';
  document.querySelectorAll('[data-nav]').forEach(a=>a.classList.toggle('on', a.dataset.nav===view));
  // Kunder ser ingen personale-menu; den vises kun på #personale og #qr
  document.getElementById('topbar').style.display = view==='bestil' ? 'none' : 'flex';
  if(h.startsWith('k-')){ state.form.canteenId = canteenFromUrl(); state.step = state.step==='done'?'menu':state.step; }
  if(view==='personale') renderStaff();
  else if(view==='qr') renderQr();
  else renderCustomer();
}
if(CONFIG.testPrices) document.getElementById('testBanner').style.display='block';
window.addEventListener('hashchange', route);
route();
